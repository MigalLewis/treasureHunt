<div class="page">
  <header class="site-header">
    <div class="logo">Treasure Hunt Day</div>
    <nav class="nav-links">
      <a [routerLink]="['/']">Back to home</a>
    </nav>
    <a class="primary-btn" [routerLink]="['/']">View event</a>
  </header>

  <main class="registration">
    <section class="intro">
      <p class="eyebrow">Business partners</p>
      <h1>Company participation registration</h1>
      <p>
        Register your business to take part in the Parktown North Treasure Hunt Day. We will follow
        up to confirm logistics, placement, and the final invoice.
      </p>
    </section>

    <section class="form-card">
      <form class="registration-form">
        <div class="field-grid">
          <label>
            Company name
            <input type="text" name="companyName" placeholder="Business name" required />
          </label>
          <label>
            Contact person
            <input type="text" name="contactName" placeholder="Full name" required />
          </label>
          <label>
            Email address
            <input type="email" name="email" placeholder="name@company.com" required />
          </label>
          <label>
            Phone number
            <input type="tel" name="phone" placeholder="+27 00 000 0000" required />
          </label>
          <label>
            Business address
            <input type="text" name="address" placeholder="Street, suburb" />
          </label>
          <label>
            Website or social handle
            <input type="text" name="website" placeholder="www.example.com" />
          </label>
        </div>

        <fieldset class="options">
          <legend>Select your participation option</legend>
          <label class="option">
            <input type="radio" name="ticketOption" required />
            <div>
              <span class="option-title">
                Local Business Participation Ticket - Business included in the race activities at ENR
                (event starting &amp; ending point). Table top exhibition
              </span>
            </div>
          </label>
          <label class="option">
            <input type="radio" name="ticketOption" />
            <div>
              <span class="option-title">
                Donation towards fundraising for participating NGO&apos;s
              </span>
            </div>
          </label>
          <label class="option">
            <input type="radio" name="ticketOption" />
            <div>
              <span class="option-title">
                Local Business Gift Bag insert only participation - advertise your business in goodie bag
                given to each participant but no race activity participation
              </span>
              <span class="option-price">R 550 + R38.49 booking fee</span>
            </div>
          </label>
          <label class="option">
            <input type="radio" name="ticketOption" />
            <div>
              <span class="option-title">
                Local Business Participation Ticket - Business included in the race activities at their
                business premises
              </span>
              <span class="option-price">R 750 + R49.76 booking fee</span>
            </div>
          </label>
        </fieldset>

        <label class="notes">
          Additional notes
          <textarea
            name="notes"
            rows="4"
            placeholder="Share any space requirements, activity ideas, or preferred timing"
          ></textarea>
        </label>

        <label class="consent">
          <input type="checkbox" required />
          <span>I agree to be contacted about logistics and next steps.</span>
        </label>

        <button class="primary-btn" type="submit">Submit registration</button>
      </form>
    </section>
  </main>
</div>
